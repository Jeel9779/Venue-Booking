<!-- Purpose: Template: Defines the visual layout and structure for the component. -->
<div class="bg-white dark:bg-slate-900 border border-gray-200 dark:border-slate-700 shadow-sm dark:shadow-none p-6 rounded-3xl flex flex-col items-center transition-all duration-200 hover:shadow-md">

    <h3 class="font-bold text-gray-900 dark:text-slate-100 mb-4">Revenue Source</h3>

    <div class="relative w-40 h-40 mb-4">
        <svg class="w-full h-full -rotate-90">
            <circle cx="80" cy="80" r="60" stroke="#eee" stroke-width="20" fill="none" />
            
            <!-- Active Subscriptions -->
            <circle cx="80" cy="80" r="60" stroke="#4f46e5" stroke-width="20" stroke-dasharray="377"
                [attr.stroke-dashoffset]="activeDashOffset" fill="none" />
                
            <!-- Grace Period Subscriptions -->
            <circle cx="80" cy="80" r="60" stroke="#22c55e" stroke-width="20" stroke-dasharray="377"
                [attr.stroke-dashoffset]="graceDashOffset" fill="none" />
        </svg>

        <div class="absolute inset-0 flex items-center justify-center flex-col">
            <span class="font-bold text-lg">₹{{ (totalAmount / 1000).toFixed(1) }}k</span>
            <span class="text-xs text-gray-400">Total</span>
        </div>
    </div>

</div>
