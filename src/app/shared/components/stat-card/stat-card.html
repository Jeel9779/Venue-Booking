<!-- Purpose: Template: Defines the visual layout and structure for the component. -->
<div class="stat-card bg-white p-6 rounded-[32px] border border-slate-200 shadow-sm group hover:shadow-md transition-all">
  <div class="flex justify-between items-start mb-4">
    <div [class]="'p-3 rounded-2xl flex items-center justify-center ' + bg">
      <lucide-icon [name]="icon" size="20" [class]="'text-' + color + '-600'"></lucide-icon>
    </div>
    <div [class]="'text-[10px] font-black px-2 py-1 rounded-lg uppercase tracking-wider ' + (change.startsWith('+') ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600')">
      {{ change }}
    </div>
  </div>
  
  <p class="text-[11px] font-black text-slate-400 uppercase tracking-widest mb-1">{{ title }}</p>
  <h3 class="text-3xl font-black text-slate-900 tracking-tighter">{{ value }}</h3>
  
  <div class="mt-4 h-1.5 w-full bg-slate-100 rounded-full overflow-hidden">
    <div [class]="'h-full rounded-full transition-all duration-1000 ' + bar"></div>
  </div>
</div>
