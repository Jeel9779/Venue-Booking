<div class="bg-indigo-500 rounded-3xl p-6 text-white h-full flex flex-col justify-between shadow-lg shadow-indigo-200">
    <div>
        <h3 class="font-bold text-lg mb-4 opacity-90">Actionable Insights</h3>
        
        <div class="space-y-3">
            <div *ngFor="let insight of insights" 
                 class="bg-white/10 rounded-xl p-4 text-sm font-medium border border-white/10 flex items-center justify-between">
                <span>{{ insight.message }}</span>
                <span class="w-2 h-2 rounded-full" 
                      [ngClass]="{
                          'bg-red-400': insight.priority === 'high',
                          'bg-amber-400': insight.priority === 'medium',
                          'bg-emerald-400': insight.priority === 'low'
                      }"></span>
            </div>
        </div>
        
        <div *ngIf="insights.length === 0" class="bg-white/10 rounded-xl p-4 text-sm font-medium border border-white/10 text-center">
            All caught up! No pending actions.
        </div>
    </div>

    <button class="w-full mt-6 bg-white text-indigo-600 font-bold py-3 rounded-xl hover:bg-indigo-50 transition-colors">
        Go to Action Queue
    </button>
</div>
