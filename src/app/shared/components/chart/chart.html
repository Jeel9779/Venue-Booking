<!-- Purpose: Template: Defines the visual layout and structure for the component. -->
<div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 shadow-sm dark:shadow-none p-8 rounded-[2.5rem] transition-all duration-300 hover:shadow-md h-full flex flex-col">
    <div class="flex items-center justify-between mb-8">
        <div>
            <h3 class="text-xl font-black text-slate-900 dark:text-slate-100 tracking-tight">{{ title }}</h3>
            <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mt-1">{{ description }}</p>
        </div>
    </div>

    <div class="flex gap-6 h-64">
        <!-- Y-Axis Labels -->
        <div class="flex flex-col justify-between text-[10px] font-black text-slate-500 dark:text-slate-400 uppercase w-8 h-56">
            @for (label of yAxisLabels; track label) {
                <span>{{ label }}</span>
            }
        </div>

        <!-- Chart Area -->
        <div class="flex-1 relative h-56 group">
            <!-- Horizontal Grid Lines -->
            <div class="absolute inset-0 flex flex-col justify-between pointer-events-none">
                @for (line of [1,2,3,4,5]; track line) {
                    <div class="w-full border-t border-slate-100 border-dashed"></div>
                }
            </div>

            <!-- Bars Container -->
            <div class="absolute inset-0 flex items-end justify-center gap-8 px-4 z-10">
                @for (val of data; track $index) {
                <div class="flex flex-col items-center flex-1 max-w-[40px] h-full relative group/bar">
                    <!-- Tooltip -->
                    <div class="absolute bottom-full mb-3 px-3 py-2 bg-slate-900 text-white text-[10px] font-black rounded-xl opacity-0 group-hover/bar:opacity-100 transition-all duration-300 translate-y-2 group-hover/bar:translate-y-0 whitespace-nowrap shadow-xl z-20">
                        {{ labels[$index] }}: {{ val }}
                        <div class="absolute top-full left-1/2 -translate-x-1/2 border-8 border-transparent border-t-slate-900"></div>
                    </div>

                    <!-- The Bar -->
                    <div class="flex-1 w-full flex items-end mb-4">
                        <div class="w-full rounded-t-xl transition-all duration-500 hover:scale-x-110 shadow-sm dark:shadow-none bg-indigo-500" 
                             [style.height.%]="getPercentage(val)">
                        </div>
                    </div>
                    
                    <!-- X-Axis Label -->
                    @if (labels[$index]) {
                        <span class="text-[10px] font-black text-slate-600 dark:text-slate-400 uppercase tracking-widest whitespace-nowrap">
                            {{ labels[$index] }}
                        </span>
                    }
                </div>
                }
            </div>
        </div>
    </div>
</div>
